name: Testing
on: push

jobs:
  test_server:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Run Django unit tests
      run: |
        pip3 install --user django
        python airline/manage.py test

  test-javascript:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Run JavaScript tests
      run: |
        pip3 install --user -r requirements.txt
        python tests.py